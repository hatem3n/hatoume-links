<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09070f" />
  <meta name="description" content="كل حسابات حتومَ وروابطه في مكان واحد." />
  <title>حتومَ | حساباتي وروابطي</title>
  <style>
    :root{--bg:#09070f;--muted:#b8adc9;--purple:#9b5cff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;background:radial-gradient(ellipse at 50% 0%,#352052 0%,#130d20 38%,var(--bg) 72%);display:flex;justify-content:center;align-items:center}
    .page{width:100%;max-width:440px;text-align:center}
    .card{position:relative;overflow:hidden;padding:30px 22px 24px;border:1px solid #ffffff18;border-radius:28px;background:linear-gradient(155deg,#1b1328ef,#100c18f2);box-shadow:0 24px 80px #0008,0 0 45px #8b43ff12}
    .glow{position:absolute;width:190px;height:190px;border-radius:50%;background:#8c43ff22;filter:blur(55px);top:-95px;left:calc(50% - 95px);pointer-events:none}
    .avatar-wrap{position:relative;width:124px;height:124px;margin:0 auto 16px;padding:4px;border-radius:50%;background:linear-gradient(135deg,#d5b2ff,#8d4aff,#5220a7);box-shadow:0 0 30px #9b5cff40}
    .avatar{width:100%;height:100%;display:block;border-radius:50%;object-fit:cover;background:#241a33}
    h1{position:relative;margin:0;font-size:32px;letter-spacing:.2px}
    .handle{color:#c49cff;font-size:14px;margin:5px 0 12px;direction:ltr}
    .bio{color:var(--muted);font-size:14px;line-height:1.8;margin:0 auto 23px;max-width:300px}
    .links{display:grid;gap:11px}
    .link{display:flex;align-items:center;justify-content:center;gap:10px;min-height:53px;padding:13px 16px;border-radius:15px;color:#fff;text-decoration:none;font-weight:650;font-size:15px;border:1px solid #ffffff19;background:#ffffff08;transition:transform .18s ease,background .18s ease,border-color .18s ease}
    .link:hover,.link:focus-visible{transform:translateY(-2px);background:#8b4cf52a;border-color:#a56bff8a;outline:none}
    .link.primary{background:linear-gradient(100deg,#793de0,#a05bff);border-color:#bd91ff70;box-shadow:0 8px 24px #7135d52e}
    .symbol{display:inline-grid;place-items:center;width:24px;height:24px;font-size:19px}
    .disabled{color:#9c91ad;background:#ffffff05;border:1px dashed #ffffff22;cursor:default}
    .note{color:#8e829f;font-size:11px;margin:19px 0 0}
    footer{color:#766b86;font-size:12px;margin-top:18px}
    @media(max-width:360px){.card{padding:25px 16px 20px}h1{font-size:28px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="حسابات حتومَ">

      <!-- ضع صورتك بجانب هذا الملف باسم profile.jpg -->
      <div class="avatar-wrap">
        <img class="avatar" src="profile.jpg" alt="الصورة الشخصية لحتومَ" onerror="this.onerror=null;this.src='https://placehold.co/300x300/241a33/ffffff?text=H';" />
      </div>
      <h1>حتومَ</h1>
      <p class="handle">@HATOUM</p>
      <p class="bio">أهلًا في عالمي ✨<br>كل حساباتي وروابطي بمكان واحد.</p>
      <nav class="links" aria-label="روابط الحسابات">
        <a class="link primary" href="https://www.instagram.com/u3___g?srtk=MWEwN24zdncyZ2p3aA==" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">◎</span> إنستغرام</a>
        <a class="link" href="https://discord.gg/P9HP2XvqD" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">🎮</span> ديسكورد — انضم للسيرفر</a>
        <a class="link" href="https://www.facebook.com/share/1C66T1km2v/" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">f</span> فيسبوك</a>
        <a class="link" href="https://youtube.com/@hatem3n?si=cK6gcdBePPq038nz" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">▶</span> يوتيوب</a>
        <a class="link" href="https://www.snapchat.com/add/h_47x1?share_id=9KRlsvuC53M&amp;locale=ar-JO" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">👻</span> سناب شات</a>
        <a class="link" href="https://t.me/H_47x1" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">✈</span> تلغرام</a>
        <span class="link disabled" aria-disabled="true"><span class="symbol" aria-hidden="true">◇</span> روبلوكس — أضف الرابط لاحقًا</span>
        <span class="link disabled" aria-disabled="true"><span class="symbol" aria-hidden="true">♪</span> تيك توك — أضف الرابط لاحقًا</span>
      </nav>
      <p class="note">تابعني على حساباتي الرسمية 💜</p>
    </section>
    <footer>© حتومَ — جميع الحقوق محفوظة</footer>
  </main>
</body>
</html>
